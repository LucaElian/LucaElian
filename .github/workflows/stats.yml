name: Update profile languages

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/stats.yml"

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=16161D&title_color=7E9CD8&text_color=DCD7BA&border_color=223249&border_radius=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Apply Kanagawa language colors
        run: |
          sed -i 's/#f34b7d/#7E9CD8/g' profile/top-langs.svg
          sed -i 's/#178600/#98BB6C/g' profile/top-langs.svg
          sed -i 's/#9400ff/#957FB8/g' profile/top-langs.svg
          sed -i 's/#3572A5/#E6C384/g' profile/top-langs.svg
          sed -i 's/#663399/#D27E99/g' profile/top-langs.svg
          sed -i 's/#e38c00/#C34043/g' profile/top-langs.svg

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git commit -m "Update language stats" || exit 0
          git push